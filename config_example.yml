# Project name, used to register with Jumpserver, purely for identification, must not be duplicated
# NAME: {{ Hostname }}

# Jumpserver project URL, used for the API request that performs registration
CORE_HOST: http://127.0.0.1:8080

# Bootstrap Token, pre-shared secret key, used to register the service account and terminal used by coco
# Must match the jumpserver configuration file; can be removed once registration is complete
BOOTSTRAP_TOKEN: <PleasgeChangeSameWithJumpserver>

# IP bound at startup, default 0.0.0.0
# BIND_HOST: 0.0.0.0

# SSH port to listen on, default 2222
# SSHD_PORT: 2222

# HTTP/WS port to listen on, default 5000
# HTTPD_PORT: 5000

# Set the log level [DEBUG, INFO, WARN, ERROR, FATAL, CRITICAL]
# LOG_LEVEL: INFO

# SSH connection timeout (default 15 seconds)
# SSH_TIMEOUT: 15

# Api Http request timeout (default 30 seconds)
# HTTP_REQUEST_TIMEOUT: 30

# Language [en,zh]
# LANGUAGE_CODE: zh

# Whether SFTP shows hidden files
# SFTP_SHOW_HIDDEN_FILE: false

# Whether to reuse a connection the user already has established with a backend asset (users won't reuse other users' connections)
# REUSE_CONNECTION: true

# Asset loading strategy, adjust according to asset scale. Default loads assets asynchronously with async search pagination; if set to "all", all assets are loaded upfront with local search pagination.
# ASSET_LOAD_POLICY:

# Maximum size for zip compression (unit: M)
# ZIP_MAX_SIZE: 1024M

# Temporary directory used for zip compression /tmp
# ZIP_TMP_PATH: /tmp

# Heartbeat interval sent to the SSH Client connection (unit: seconds), default 30, 0 means don't send
# CLIENT_ALIVE_INTERVAL: 30

# Number of heartbeat-packet retries sent to the asset, default 3
# RETRY_ALIVE_COUNT_MAX: 3

# Session-sharing storage type [local, redis], default local
# SHARE_ROOM_TYPE: local

# Redis configuration
# REDIS_HOST: 127.0.0.1
# REDIS_PORT: 6379
# REDIS_PASSWORD:
# REDIS_CLUSTERS:
# REDIS_DB_ROOM:

# Whether to enable local port forwarding (currently only affects vscode remote ssh)
# ENABLE_LOCAL_PORT_FORWARD: false

# Whether to enable remote development support for vscode's remote-ssh (prerequisite: ENABLE_LOCAL_PORT_FORWARD must be enabled)
# ENABLE_VSCODE_SUPPORT: false

# Whether KoKo runs with privileged permissions. When false, Kubernetes cluster connections will report insufficient deployment permissions
# KOKO_PRIVILEGED: true
